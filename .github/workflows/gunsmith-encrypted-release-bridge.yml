name: 枪械素材加密中转

on:
  push:
    branches:
      - temp/gunsmith-archive-bridge-20261012
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    name: 下载、加密并发布临时中转包
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出临时分支
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: 下载并固化来源
        env:
          OUTPUT_DIR: bundle
          PYTHONUNBUFFERED: '1'
        run: python scripts/collect_free_commercial_guns.py

      - name: 校验下载结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('bundle/acceptance.json').read_text(encoding='utf-8'))
          if result['sourceCount'] < 12:
              raise SystemExit(f"有效来源过少：{result['sourceCount']}")
          if result['fileCount'] < 15:
              raise SystemExit(f"来源文件过少：{result['fileCount']}")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: 拆分超大来源包
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          from pathlib import Path

          transfer = Path('transfer')
          transfer.mkdir()

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def source_files(source_id: str) -> list[Path]:
              root = Path('bundle/packages') / source_id
              result = sorted((path for path in root.rglob('*') if path.is_file()), key=lambda path: (-path.stat().st_size, path.name))
              if not result:
                  raise SystemExit(f'来源为空：{source_id}')
              return result

          manifest: dict[str, object] = {'schemaVersion': 1, 'sources': {}}

          stein = source_files('stein-classic-weapons')
          stein_main = stein[0]
          main_dir = transfer / 'stein-main'
          main_dir.mkdir()
          chunk_size = 60 * 1024 * 1024
          chunks = []
          with stein_main.open('rb') as stream:
              index = 1
              while True:
                  payload = stream.read(chunk_size)
                  if not payload:
                      break
                  target = main_dir / f'{stein_main.name}.part-{index:03d}'
                  target.write_bytes(payload)
                  chunks.append({'name': target.name, 'bytes': target.stat().st_size, 'sha256': sha256(target)})
                  index += 1
          stein_secondary_dir = transfer / 'stein-secondary'
          stein_secondary_dir.mkdir()
          secondary = []
          for source in stein[1:]:
              target = stein_secondary_dir / source.name
              shutil.copy2(source, target)
              secondary.append({'name': target.name, 'bytes': target.stat().st_size, 'sha256': sha256(target)})
          manifest['sources']['stein-classic-weapons'] = {
              'main': {'name': stein_main.name, 'bytes': stein_main.stat().st_size, 'sha256': sha256(stein_main), 'chunks': chunks},
              'secondary': secondary,
              'restore': f"cat '{stein_main.name}.part-'* > '{stein_main.name}'",
          }

          polyyai = source_files('polyyai-low-poly-guns')
          polyyai_records = []
          for label, source in zip(('main', 'secondary'), polyyai, strict=True):
              target_dir = transfer / f'polyyai-{label}'
              target_dir.mkdir()
              target = target_dir / source.name
              shutil.copy2(source, target)
              polyyai_records.append({'group': label, 'name': target.name, 'bytes': target.stat().st_size, 'sha256': sha256(target)})
          manifest['sources']['polyyai-low-poly-guns'] = polyyai_records

          (transfer / 'LARGE_SOURCE_REASSEMBLY.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: 上传归档目录与许可证清单
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-catalog-20261012
          path: |
            bundle/README_FIRST.md
            bundle/archive-manifest.json
            bundle/acceptance.json
            bundle/SHA256SUMS.txt
            transfer/LARGE_SOURCE_REASSEMBLY.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 Stein 主包分片一
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-source-stein-main-part-001
          path: transfer/stein-main/*.part-001
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 Stein 主包分片二
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-source-stein-main-part-002
          path: transfer/stein-main/*.part-002
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 Stein 主包分片三
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-source-stein-main-part-003
          path: transfer/stein-main/*.part-003
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 Stein 次要来源包
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-source-stein-secondary
          path: transfer/stein-secondary
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 Polyyai 主来源包
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-source-polyyai-main
          path: transfer/polyyai-main
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 Polyyai 次要来源包
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-source-polyyai-secondary
          path: transfer/polyyai-secondary
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传第一组 CC0 枪械来源
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-sources-cc0-core-a
          path: |
            bundle/packages/kenney-blaster-kit
            bundle/packages/mehrasaur-3d-weapons
            bundle/packages/texnist-voxel-weapons
            bundle/packages/peu-blasters-free
            bundle/packages/cosmo-low-poly-guns
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传第二组免费商用枪械来源
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-sources-commercial-core-b
          path: |
            bundle/packages/dark-palette-weapon-arsenal
            bundle/packages/retro-spud-pixel-arsenal
            bundle/packages/heyheythere-psx-firearms-free
            bundle/packages/heyheythere-psx-fps-arms-free
            bundle/packages/lazy-spar7an-psx-gun-pack
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 上传 OpenGameArt 枪械来源
        uses: actions/upload-artifact@v4
        with:
          name: gunsmith-sources-opengameart
          path: |
            bundle/packages/opengameart-oldschool-afps
            bundle/packages/opengameart-soviet-assault-rifle
            bundle/packages/opengameart-vss
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 创建加密归档
        run: |
          set -euo pipefail
          tar --zstd -cf FreeCommercialGunSources-20261012.tar.zst bundle
          openssl rand -base64 48 > archive.pass
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in FreeCommercialGunSources-20261012.tar.zst \
            -out FreeCommercialGunSources-20261012.tar.zst.enc \
            -pass file:archive.pass
          cat > bridge-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAw1dO4enrBTyXgWId1bwl
          7+dJGV7jYzoxD1JmxrPslkh1DY3FxaHpVvGcso4Z9yqBq/O4ue6KsNJeh+6FONFs
          nqHkNvW6pDxcDHQWvytf1pGbFy/mQFIuxlJHferzUBo0S1LbEE2/pPh6BF9aCE3V
          kyyQwXOJUj7FGz0BIZ63ZSf+6BKnzynCkXqnFi4fWnnEpjX0YhsU1klsOdwxT3wl
          D9cebLu/6XE4+L/g7EleXI0s5ZChW+ScWS81F7Flsxnq+ZGDnFltpMxxWJkmuJjd
          iuaYpiMw1A1BA+4jq+c3yFM5DoFfIfPuUwOTs3VXleTxjeLc8fAe+eXEvgusiqK+
          Hs3ERoAKgL50rLhKpgq0wsbSPGsFkEgeMoWaDZFd3l38tmI1uUdQXXSIRjqEZD1d
          ki6tZYkg+Mrn6ell2ouIaYOZfOczaDJbh3mwaX1763e0mqDfsowLCv9gYm0tEGBf
          yO3vwkv5xhUcIPfb789jscs9SGYTLNDVeo2L5TCBwTZzAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey bridge-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in archive.pass \
            -out FreeCommercialGunSources-20261012.pass.rsa
          sha256sum \
            FreeCommercialGunSources-20261012.tar.zst \
            FreeCommercialGunSources-20261012.tar.zst.enc \
            FreeCommercialGunSources-20261012.pass.rsa \
            > BRIDGE_SHA256SUMS.txt
          rm -f archive.pass bridge-public.pem FreeCommercialGunSources-20261012.tar.zst
          du -sh bundle FreeCommercialGunSources-20261012.tar.zst.enc
          cat BRIDGE_SHA256SUMS.txt

      - name: 创建临时加密发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: gunsmith-bridge-20261012
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Masamune 枪械素材加密中转 2026-10-12" \
            --prerelease \
            --notes "临时加密中转包。源文件使用 AES-256-CBC/PBKDF2 加密，随机口令仅以 RSA-OAEP 密文发布；传输完成后删除。" \
            FreeCommercialGunSources-20261012.tar.zst.enc \
            FreeCommercialGunSources-20261012.pass.rsa \
            BRIDGE_SHA256SUMS.txt \
            bundle/archive-manifest.json \
            bundle/acceptance.json \
            bundle/README_FIRST.md
